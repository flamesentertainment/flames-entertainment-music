    <section id="welcome">
      <h2 class="sectionTitle">Contact me</h2>
      <p>I would realy like to hear from you!</p>
      <form action="https://httpbin.org/get" method="get">
        <div>       
          <label for="firstName">First Name:</label>
          <input type="text" name="firstName" id="firstName" placeholder="john" autocomplete="on" required autofocus>
        </div>
            <div>
            <label for="LastName">Last Name:</label>
            <input type="text" name="lastName" id="lastName" placeholder="doe" autocomplete="on" required>
            </div>
         <fieldset id="textMessage">
            <legend>Send Me A Note</legend>
            <label for="message">Your Message</label>
            <br>
            <textarea name="message" id="message" placeholder="Tyoe your message here" cols="30" rows="10"></textarea>
            <br>
        </fieldset>
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
      </form>
